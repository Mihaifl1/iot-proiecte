<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proiecte IoT – schemă + sketch ESP</title>
  <meta name="description" content="Proiecte IoT de reprodus: schemă de cablare și sketch Arduino/ESP gata de upload. Introdu numărul proiectului din video." />
  <meta property="og:title" content="Proiecte IoT – #001 #002 #003…" />
  <meta property="og:description" content="Schemă + sketch ESP ca să reproduci proiectele din video" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header id="site-header"></header>

    <!-- HUB -->
    <div id="view-hub" class="view active">
      <section class="hero">
        <div class="hero-deco" aria-hidden="true">
          <!-- ESP board -->
          <div class="chip-icon" title="ESP">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="10" y="6" width="28" height="36" rx="3" fill="#2a3544" stroke="#5b9fd4" stroke-width="1.4"/>
              <rect x="14" y="12" width="20" height="12" rx="1.5" fill="#1a222c" stroke="#5eb8a8" stroke-width="1"/>
              <circle cx="18" cy="34" r="2" fill="#5b9fd4"/>
              <circle cx="24" cy="34" r="2" fill="#5eb8a8"/>
              <circle cx="30" cy="34" r="2" fill="#8fbc8f"/>
              <rect x="16" y="8" width="4" height="2" rx="0.5" fill="#6b7c8e"/>
              <rect x="22" y="8" width="4" height="2" rx="0.5" fill="#6b7c8e"/>
              <rect x="28" y="8" width="4" height="2" rx="0.5" fill="#6b7c8e"/>
            </svg>
          </div>
          <!-- Relay -->
          <div class="chip-icon" title="Releu">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="8" y="14" width="32" height="20" rx="3" fill="#2a3544" stroke="#d4a574" stroke-width="1.4"/>
              <rect x="12" y="18" width="10" height="12" rx="1.5" fill="#1a222c" stroke="#5b9fd4" stroke-width="1"/>
              <circle cx="30" cy="24" r="5" fill="#1a222c" stroke="#5eb8a8" stroke-width="1.2"/>
              <path d="M28 24h4M30 22v4" stroke="#5eb8a8" stroke-width="1.2" stroke-linecap="round"/>
              <rect x="14" y="10" width="3" height="5" rx="0.5" fill="#8b9aab"/>
              <rect x="20" y="10" width="3" height="5" rx="0.5" fill="#8b9aab"/>
              <rect x="26" y="10" width="3" height="5" rx="0.5" fill="#8b9aab"/>
            </svg>
          </div>
          <!-- LED + resistor -->
          <div class="chip-icon" title="LED">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M24 8c-5 0-9 4-9 9 0 4 2.5 6.5 5 9v4h8v-4c2.5-2.5 5-5 5-9 0-5-4-9-9-9z" fill="#2a3544" stroke="#8fbc8f" stroke-width="1.3"/>
              <rect x="20" y="30" width="8" height="3" rx="0.5" fill="#5b9fd4"/>
              <line x1="22" y1="33" x2="20" y2="42" stroke="#8b9aab" stroke-width="1.4" stroke-linecap="round"/>
              <line x1="26" y1="33" x2="28" y2="42" stroke="#8b9aab" stroke-width="1.4" stroke-linecap="round"/>
              <circle cx="24" cy="16" r="3" fill="#5eb8a8" opacity="0.7"/>
            </svg>
          </div>
          <!-- Sensor / jumper vibe -->
          <div class="chip-icon" title="Senzor">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="12" y="10" width="24" height="28" rx="3" fill="#2a3544" stroke="#5eb8a8" stroke-width="1.4"/>
              <circle cx="24" cy="22" r="7" fill="#1a222c" stroke="#5b9fd4" stroke-width="1.2"/>
              <circle cx="24" cy="22" r="3" fill="#5b9fd4" opacity="0.6"/>
              <rect x="16" y="34" width="4" height="6" rx="0.5" fill="#d4a574"/>
              <rect x="22" y="34" width="4" height="6" rx="0.5" fill="#8b9aab"/>
              <rect x="28" y="34" width="4" height="6" rx="0.5" fill="#8fbc8f"/>
            </svg>
          </div>
        </div>
        <h1>Proiecte IoT</h1>
        <p>Vrei să reproduci un proiect din video? Introdu numărul și primești schema + sketch-ul.</p>
      </section>

      <div class="num-box">
        <label for="project-number">Număr proiect</label>
        <div class="num-row">
          <input
            id="project-number"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="001"
            maxlength="6"
            aria-label="Număr proiect"
          />
          <button type="button" id="btn-go">Deschide</button>
        </div>
        <p class="num-hint">Exemple: 001 · 1 · 002 · 003</p>
        <p class="num-error" id="num-error"></p>
      </div>

      <div class="section-title">Toate proiectele</div>
      <div class="list" id="project-list"></div>

      <p class="foot">Schemă + sketch public · ESP8266 / ESP32 · reprodus ușor acasă</p>
    </div>

    <!-- PROJECT (filled by JS) -->
    <div id="view-project" class="view"></div>
  </div>

  <script src="projects-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
